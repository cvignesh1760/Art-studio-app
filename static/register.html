<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Yatra+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Create account - Art Studio</title>
</head>
<body>
  <div class="auth">
    <div class="auth-art">
      <div id="art"></div>
      <h2>Join Art Studio</h2>
      <p>Create a free account to buy paintings, book a wall and request pottery.</p>
    </div>
    <div class="auth-form">
      <div class="panel">
        <h1 style="font-size:2rem">Create an account</h1>
        <label>Name <input type="text" id="name" autocomplete="name"></label>
        <label>Email <input type="email" id="email" autocomplete="email"></label>
        <label>Password <span class="hint">(at least 6 characters)</span>
          <input type="password" id="password" autocomplete="new-password"></label>
        <div class="actions-row"><button class="btn primary" id="registerBtn">Create account</button></div>
        <p>Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>
  <div id="message"></div>
  <script src="app.js"></script>
  <script>
    document.getElementById("art").innerHTML = dancersSvg();

    async function register() {
      try {
        await api("/register", "POST", {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        });
        window.location.href = "index.html";
      } catch (e) {
        showMessage("message", e.message, true);
      }
    }
    document.getElementById("registerBtn").onclick = register;
    document.getElementById("password").onkeydown = function (e) { if (e.key === "Enter") register(); };
  </script>
</body>
</html>
